# Render blueprint for a FREE DEMO of Rento (API + admin panel in one service). Not for real bookings: free instances
# sleep when idle and have no uptime promise (README §17, AGENTS.md). Steps and limits: docs/deploy-free-demo.md.
services:
  - type: web
    name: rento
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS ap-southeast-1): every query crosses this link.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # The free Postgres (with PostGIS) you created, e.g. on Neon: postgres://…?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Random signing secret, generated once by Render (>= 32 characters).
      - key: JWT_SECRET
        generateValue: true
      # The address Render gave this service — used in e-mail links and the sign-in origin check. Not a secret.
      # A fork deploying its own copy gets a different address: change both lines to it.
      - key: PUBLIC_WEB_URL
        value: https://rento-zc0w.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rento-zc0w.onrender.com
      # A DEMO: the in-process payment gateway (no real money moves) and no outgoing mail server.
      - key: PAYMENT_PROVIDER
        value: fake
      - key: SMTP_HOST
        value: smtp.invalid
      - key: MAIL_FROM
        value: Rento Demo <no-reply@rento.invalid>
      # Free instances have 512 MB: keep the database pool small.
      - key: DB_POOL_MAX
        value: '5'
