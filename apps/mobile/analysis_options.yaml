include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed puts @JsonKey on constructor parameters; json_serializable reads them there (documented upstream).
    invalid_annotation_target: ignore
  exclude:
    # Generated by `flutter gen-l10n` — committed, never edited by hand.
    - lib/l10n/generated/**
    # build_runner output (freezed / json_serializable) — committed, never edited by hand.
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true
    always_declare_return_types: true
